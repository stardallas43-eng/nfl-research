 NFL name: NFL historical public-data collection

# Raw public inputs only. No wagers, personal records, paid services or credentials.
# Replaces the two-file transfer check. This does NOT train the full NFL model.
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/nfl-data-check.yml]

permissions:
  contents: read

concurrency:
  group: nfl-historical-public-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        season: [2022, 2023, 2024, 2025]
    env:
      NFL_SEASON: ${{ matrix.season }}
    steps:
      - name: Download and inspect public datasets
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Collect public NFL sources for one season; no model training or wagers."""
          from __future__ import annotations
          import csv
          import gzip
          import hashlib
          import io
          import json
          import os
          import time
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          
          BASE = "https://github.com/nflverse/nflverse-data/releases/download/"
          MAX_FILE = 192 * 1024 * 1024
          MAX_TOTAL = 1024 * 1024 * 1024
          MAX_EXPANDED = 512 * 1024 * 1024
          MIN_COLUMNS = {
              "schedule": {"game_id", "season", "week", "away_team", "home_team"},
              "injuries": {"season", "week", "team", "gsis_id", "report_status"},
              "weekly_rosters": {"season", "week", "team", "gsis_id", "position"},
              "snap_counts": {"game_id", "season", "week", "player", "position"},
              "play_by_play": {"game_id", "season", "week", "posteam", "defteam"},
              "ftn_charting": {"nflverse_game_id", "season", "week"},
          }
          
          
          def now() -> str:
              return datetime.now(timezone.utc).isoformat()
          
          
          def plan(year: int) -> list[dict]:
              specs = [
                  ("injuries", "injuries", "injuries_", True),
                  ("weekly_rosters", "weekly_rosters", "roster_weekly_", True),
                  ("depth_charts", "depth_charts", "depth_charts_", True),
                  ("snap_counts", "snap_counts", "snap_counts_", True),
                  ("play_by_play", "pbp", "play_by_play_", True),
                  ("ftn_charting", "ftn_charting", "ftn_charting_", False),
              ]
              specs += [("pfr_" + kind, "pfr_advstats", "advstats_week_" + kind + "_", False)
                        for kind in ("pass", "rush", "rec", "def")]
              rows = [{"family": "schedule", "stem": "games", "required": True,
                       "urls": ["https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv"]}]
              for family, tag, prefix, required in specs:
                  stem = prefix + str(year)
                  rows.append({"family": family, "stem": stem, "required": required,
                               "urls": [BASE + tag + "/" + stem + ext for ext in (".csv.gz", ".csv")]})
              if year == 2022:
                  for kind in ("passing", "rushing", "receiving"):
                      stem = "ngs_" + kind
                      rows.append({"family": "nextgen_" + kind, "stem": stem, "required": False,
                                   "urls": [BASE + "nextgen_stats/" + stem + ext for ext in (".csv.gz", ".csv")]})
                  for tag in ("officials", "combine"):
                      rows.append({"family": tag, "stem": tag, "required": False,
                                   "urls": [BASE + tag + "/" + tag + ext for ext in (".csv.gz", ".csv")]})
              return rows
          
          
          def number(value):
              try:
                  return int(float(value))
              except (TypeError, ValueError, OverflowError):
                  return None
          
          
          def inspect_csv(path: Path, family: str, year: int) -> dict:
              opener = gzip.open if path.name.endswith(".gz") else open
              counts, regular, weeks, teams = Counter(), Counter(), set(), set()
              timestamp_fields, timestamp_nonempty, inspected_cells = [], Counter(), 0
              rows = selected = 0
              with opener(path, "rt", encoding="utf-8-sig", newline="") as f:
                  reader = csv.DictReader(f)
                  fields = reader.fieldnames or []
                  if len(fields) < 2 or len(set(fields)) != len(fields):
                      raise ValueError("Invalid or duplicated CSV columns")
                  missing = MIN_COLUMNS.get(family, set()) - set(fields)
                  if missing:
                      raise ValueError("Missing columns: " + ", ".join(sorted(missing)))
                  timestamp_fields = [x for x in fields if x in (
                      "date_modified", "timestamp", "dt", "updated_at", "last_update", "date")]
                  for row in reader:
                      if None in row or any(v is None for v in row.values()):
                          raise ValueError("Malformed CSV row")
                      rows += 1
                      inspected_cells += sum(len(x) for x in row.values())
                      if inspected_cells > MAX_EXPANDED:
                          raise ValueError("Expanded CSV safety limit reached")
                      season = number(row.get("season", row.get("year")))
                      if season is not None:
                          counts[str(season)] += 1
                      game_type = row.get("game_type", row.get("season_type", ""))
                      if season is not None and game_type == "REG":
                          regular[str(season)] += 1
                      if season == year:
                          selected += 1
                          w = number(row.get("week"))
                          if w is not None:
                              weeks.add(w)
                          for key in ("team", "recent_team", "posteam", "defteam", "away_team", "home_team"):
                              if row.get(key):
                                  teams.add(row[key])
                          for key in timestamp_fields:
                              timestamp_nonempty[key] += bool(row.get(key))
              if rows == 0:
                  raise ValueError("Empty CSV")
              if family in MIN_COLUMNS and selected == 0:
                  raise ValueError("No requested-season rows found")
              return {"rows_all": rows, "columns": fields,
                      "rows_by_season": dict(sorted(counts.items())),
                      "regular_rows_by_season": dict(sorted(regular.items())),
                      "requested_season_rows": selected, "requested_season_weeks": sorted(weeks),
                      "requested_season_team_labels": sorted(teams),
                      "timestamp_fields": timestamp_fields,
                      "requested_season_nonempty_timestamp_counts": dict(timestamp_nonempty),
                      "point_in_time_verified": False, "implemented_as_model_feature": False}
          
          
          def fetch_file(url: str, target: Path, remaining: int) -> dict:
              limit = min(MAX_FILE, remaining)
              if limit <= 0:
                  raise ValueError("Total download safety limit reached")
              partial = target.with_name(target.name + ".partial")
              for attempt in range(2):
                  size = 0
                  digest = hashlib.sha256()
                  try:
                      req = Request(url, headers={"User-Agent": "nfl-research-public-collector/2.0"})
                      with urlopen(req, timeout=60) as response, partial.open("wb") as f:
                          content_type = response.headers.get("Content-Type", "")
                          if "text/html" in content_type.lower():
                              raise ValueError("HTML returned instead of dataset")
                          declared = number(response.headers.get("Content-Length"))
                          if declared and declared > limit:
                              raise ValueError("Declared file size exceeds safety limit")
                          while True:
                              block = response.read(1024 * 1024)
                              if not block:
                                  break
                              size += len(block)
                              if size > limit:
                                  raise ValueError("File exceeds safety limit")
                              digest.update(block)
                              f.write(block)
                          headers = {"source_last_modified": response.headers.get("Last-Modified"),
                                     "source_etag": response.headers.get("ETag"), "content_type": content_type}
                      if size == 0:
                          raise ValueError("Empty response")
                      partial.replace(target)
                      return {**headers, "bytes": size, "sha256": digest.hexdigest(), "retrieved_at_utc": now()}
                  except Exception as exc:
                      partial.unlink(missing_ok=True)
                      if attempt or isinstance(exc, ValueError) or (isinstance(exc, HTTPError) and exc.code in (401, 403, 404)):
                          raise
                      time.sleep(2)
              raise RuntimeError("Unreachable retry state")
          
          
          def main() -> int:
              year = int(os.environ.get("NFL_SEASON", "2022"))
              if year not in (2022, 2023, 2024, 2025):
                  raise ValueError("Only seasons 2022-2025 are allowed")
              out = Path("nfl-public-data") / str(year)
              raw = out / "raw"
              raw.mkdir(parents=True, exist_ok=True)
              records, total = [], 0
              for item in plan(year):
                  result = {"family": item["family"], "required": item["required"], "attempts": []}
                  for url in item["urls"]:
                      target = raw / url.rsplit("/", 1)[-1]
                      try:
                          transfer = fetch_file(url, target, MAX_TOTAL - total)
                          total += transfer["bytes"]
                          try:
                              inspection = inspect_csv(target, item["family"], year)
                          except Exception as exc:
                              result.update(status="DOWNLOADED_SCHEMA_REVIEW_REQUIRED", file=target.name,
                                            source_url=url, **transfer,
                                            error=f"{type(exc).__name__}: {str(exc)[:250]}")
                              break
                          result.update(status="DOWNLOADED_AND_STRUCTURE_CHECKED", file=target.name,
                                        source_url=url, **transfer, **inspection)
                          break
                      except Exception as exc:
                          result["attempts"].append({"url": url, "error": f"{type(exc).__name__}: {str(exc)[:250]}"})
                  if "status" not in result:
                      result["status"] = "NOT_ACQUIRED"
                  records.append(result)
                  print(json.dumps({k: result[k] for k in ("family", "status", "file", "bytes", "rows_all") if k in result}))
                  (out / "manifest.json").write_text(json.dumps(records, indent=2), encoding="utf-8")
              blockers = [x["family"] for x in records if x["required"] and x["status"] != "DOWNLOADED_AND_STRUCTURE_CHECKED"]
              gaps = [x["family"] for x in records if x["status"] != "DOWNLOADED_AND_STRUCTURE_CHECKED"]
              report = {"season": year, "created_at_utc": now(), "run_id": os.getenv("GITHUB_RUN_ID"),
                        "workflow_commit": os.getenv("GITHUB_SHA"), "total_bytes": total,
                        "checked_files": sum(x["status"] == "DOWNLOADED_AND_STRUCTURE_CHECKED" for x in records),
                        "planned_files": len(records), "required_gaps": blockers, "all_file_gaps": gaps,
                        "status": "RAW_COLLECTION_INCOMPLETE" if gaps else "PLANNED_RAW_FILES_COLLECTED",
                        "model_status": "NOT_TRAINED_OR_RERUN",
                        "as_of_status": "NOT_VERIFIED",
                        "still_not_supplied": ["Complete historical coaching and play-caller timelines",
                            "Guaranteed receiver-corner and blocker-rusher assignments or film review",
                            "Contemporary all-player agility/speed tracking",
                            "Final inactives and workload expectations for every game",
                            "Historical weather forecasts and travel arrival plans",
                            "Timestamped sportsbook quotes, public splits and original expert picks"],
                        "warnings": ["Files and field names do not prove historical completeness or predictive value.",
                            "2025 injury availability conflicts with old documentation; inspect actual rows/timestamps.",
                            "Do not treat missing report rows as healthy players.",
                            "Schedule starter/coach/referee/weather fields require pregame timing verification.",
                            "Lag play-by-play, snaps and tracking; exclude target-game results and full-season summaries.",
                            "FTN charting is not complete film or route-defender tracking.",
                            "Postseason-only participation archives deliberately excluded from this collection."]}
              (out / "run_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
              summary = [f"# NFL {year} public data collection", "", report["status"],
                         f"Checked files: {report['checked_files']} / {len(records)}", "",
                         "This is raw data collection only. No model, prediction, or backtest was run.", "",
                         "| Dataset | Status | Rows |", "|---|---|---:|"]
              summary += [f"| {x['family']} | {x['status']} | {x.get('rows_all', 'N/A')} |" for x in records]
              summary += ["", "Historical publication timing and completeness still require review.",
                          "2025 injury timestamps and the changed depth-chart schema need special attention.",
                          "FTN charting attribution: FTN Data via nflverse (CC-BY-SA 4.0). Other files retain their upstream terms.",
                          "Source documentation: https://nflreadr.nflverse.com/articles/nflverse_data_schedule.html"]
              text = "\n".join(summary) + "\n"
              (out / "summary.md").write_text(text, encoding="utf-8")
              (out / "ATTRIBUTION.md").write_text(
                  "Public datasets sourced from nflverse repositories. Preserve upstream source/licensing terms.\n"
                  "FTN charting: FTN Data via nflverse, CC-BY-SA 4.0.\n"
                  "See https://nflreadr.nflverse.com/reference/load_ftn_charting.html\n", encoding="utf-8")
              if os.getenv("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                      f.write(text)
              return 1 if blockers else 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PYTHON
      - name: Save downloaded files and gap reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nfl-public-${{ matrix.season }}-${{ github.run_id }}
          path: nfl-public-data/${{ matrix.season }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
